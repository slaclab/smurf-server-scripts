name: Pinact
on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  pinact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install pinact
        run: |
          gh release download v5.0.0 \
            --repo suzuki-shunsuke/pinact \
            --pattern 'pinact_linux_amd64.tar.gz' \
            --dir /tmp
          tar -xzf /tmp/pinact_linux_amd64.tar.gz -C /usr/local/bin pinact
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify action pins
        run: pinact run --verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
