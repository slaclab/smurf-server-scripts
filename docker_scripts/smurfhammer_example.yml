# smurfhammer configuration
# Merged config supporting both AMC carrier and RFSoC systems.
# Copy to /data/smurf_startup_cfg/smurf_startup.yml and edit for your system.

crate:
  shelfmanager: shm-smrf-sp01   # Shelf manager hostname
  id: 1                          # Crate number (carrier IP = 10.0.<id>.<slot+100>)
  fans: 8                        # Max fan level. COMTEL=100, ASIS/ELMA=15.

tmux_session: smurf              # Name of the tmux session to create

# Path to pysmurf docker (contains run.sh)
pysmurf: /home/cryo/docker/pysmurf/dev/v11.0.3

# ─── AMC carrier slots ────────────────────────────────────────────────────────
# One entry per ATCA carrier. Remove this section if not using AMC carriers.
slots:
  4:
    pyrogue: /home/cryo/docker/smurf/stable/v11.0.3
    pysmurf_cfg: cfg_files/b33/experiment_b33_rfc1-2_C05-40_s4_2xLB_extref.cfg

# ─── RFSoC slots ─────────────────────────────────────────────────────────────
# One entry per RFSoC. These skip the carrier ethernet/reboot steps.
# Remove this section if not using RFSoCs.
rfsoc_slots:
  3:
    pyrogue: /home/cryo/docker/smurf/dev/v8.0.0-rc3_rfsoc
    pysmurf_cfg: cfg_files/b33/experiment_b33_rfc1-2_C05-40_s4_rfsoc_fiber.cfg

startup:
  reboot: true           # Deactivate/reactivate AMC carriers before starting
  setup: true            # Run S.setup() after pysmurf connects
  timing_master: false   # Require tpg_ioc docker to be running
